<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1e2030" />
		<link rel="icon" href="/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<script>
			// Apply the saved theme before first paint to avoid a flash of the default theme.
			(function () {
				try {
					var palettes = {
						Mocha: { '--bg-color': '#11111b', '--card-bg': '#1e1e2e', '--card-bg-elevated': '#181825', '--text-primary': '#cdd6f4', '--text-muted': '#7f849c', '--accent-orange': '#fab387', '--accent-blue': '#89b4fa', '--accent-purple': '#cba6f7', '--selection-bg': '#313244', '--scrollbar-thumb': '#585b70', '--nav-bg': 'rgba(17, 17, 27, 0.08)', '--card-hover': 'rgba(255, 255, 255, 0.03)' },
						Macchiato: { '--bg-color': '#1e2030', '--card-bg': '#24273a', '--card-bg-elevated': '#1e2030', '--text-primary': '#cad3f5', '--text-muted': '#8087a2', '--accent-orange': '#f0ede5', '--accent-blue': '#8aadf4', '--accent-purple': '#c6a0f6', '--selection-bg': '#363a4f', '--scrollbar-thumb': '#5b6078', '--nav-bg': 'rgba(30, 32, 48, 0.08)', '--card-hover': 'rgba(255, 255, 255, 0.03)' },
						Frappe: { '--bg-color': '#232634', '--card-bg': '#303446', '--card-bg-elevated': '#292c3c', '--text-primary': '#c6d0f5', '--text-muted': '#838ba7', '--accent-orange': '#ef9f76', '--accent-blue': '#8caaee', '--accent-purple': '#ca9ee6', '--selection-bg': '#414559', '--scrollbar-thumb': '#626880', '--nav-bg': 'rgba(35, 38, 52, 0.08)', '--card-hover': 'rgba(255, 255, 255, 0.03)' },
						Latte: { '--bg-color': '#eff1f5', '--card-bg': '#e6e9ef', '--card-bg-elevated': '#dce0e8', '--text-primary': '#4c4f69', '--text-muted': '#8c8fa1', '--accent-orange': '#fe640b', '--accent-blue': '#1e66f5', '--accent-purple': '#8839ef', '--selection-bg': '#ccd0da', '--scrollbar-thumb': '#bcc0cc', '--nav-bg': 'rgba(239, 241, 245, 0.08)', '--card-hover': 'rgba(0, 0, 0, 0.03)' },
						'Rose Pine': { '--bg-color': '#191724', '--card-bg': '#1f1d2e', '--card-bg-elevated': '#26233a', '--text-primary': '#e0def4', '--text-muted': '#908caa', '--accent-orange': '#ebbcba', '--accent-blue': '#9ccfd8', '--accent-purple': '#c4a7e7', '--selection-bg': '#2e2738', '--scrollbar-thumb': '#6e6a86', '--nav-bg': 'rgba(25, 23, 36, 0.82)', '--card-hover': 'rgba(224, 222, 244, 0.05)' },
						Nord: { '--bg-color': '#2e3440', '--card-bg': '#3b4252', '--card-bg-elevated': '#434c5e', '--text-primary': '#eceff4', '--text-muted': '#7b88a1', '--accent-orange': '#d08770', '--accent-blue': '#88c0d0', '--accent-purple': '#b48ead', '--selection-bg': '#4c566a', '--scrollbar-thumb': '#5a6578', '--nav-bg': 'rgba(46, 52, 64, 0.82)', '--card-hover': 'rgba(236, 239, 244, 0.05)' },
						Dracula: { '--bg-color': '#282a36', '--card-bg': '#44475a', '--card-bg-elevated': '#21222c', '--text-primary': '#f8f8f2', '--text-muted': '#6272a4', '--accent-orange': '#ffb86c', '--accent-blue': '#8be9fd', '--accent-purple': '#bd93f9', '--selection-bg': '#44475a', '--scrollbar-thumb': '#6272a4', '--nav-bg': 'rgba(40, 42, 54, 0.82)', '--card-hover': 'rgba(248, 248, 242, 0.05)' },
						'Tokyo Night': { '--bg-color': '#1a1b26', '--card-bg': '#24283b', '--card-bg-elevated': '#1f2335', '--text-primary': '#c0caf5', '--text-muted': '#565f89', '--accent-orange': '#7aa2f7', '--accent-blue': '#7dcfff', '--accent-purple': '#bb9af7', '--selection-bg': '#2c3459', '--scrollbar-thumb': '#565f89', '--nav-bg': 'rgba(26, 27, 38, 0.82)', '--card-hover': 'rgba(192, 202, 245, 0.06)' }
					};
					var saved = localStorage.getItem('theme-prefs');
					if (!saved) return;
					var prefs = JSON.parse(saved);
					var root = document.documentElement;
					var palette = prefs && prefs.theme ? palettes[prefs.theme] : null;
					if (palette) {
						for (var key in palette) root.style.setProperty(key, palette[key]);
						root.classList.toggle('Latte', prefs.theme === 'Latte');
						var meta = document.querySelector('meta[name="theme-color"]');
						if (meta) meta.setAttribute('content', palette['--bg-color']);
					}
					if (prefs && prefs.accent) root.style.setProperty('--accent-orange', prefs.accent);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
