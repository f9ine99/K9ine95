<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e2030" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('js');
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default theme.
      (function () {
        try {
          var palettes = {
            Macchiato: {
              '--bg-color': '#1e2030',
              '--card-bg': '#24273a',
              '--card-bg-elevated': '#1e2030',
              '--text-primary': '#cad3f5',
              '--text-muted': '#8087a2',
              '--accent-orange': '#f0ede5',
              '--accent-blue': '#8aadf4',
              '--accent-purple': '#c6a0f6',
              '--selection-bg': '#363a4f',
              '--scrollbar-thumb': '#5b6078',
              '--nav-bg': 'rgba(30, 32, 48, 0.08)',
              '--card-hover': 'rgba(255, 255, 255, 0.03)'
            },
            Latte: {
              '--bg-color': '#eff1f5',
              '--card-bg': '#e6e9ef',
              '--card-bg-elevated': '#dce0e8',
              '--text-primary': '#2e3150',
              '--text-muted': '#5c607a',
              '--heading-color': '#1e2030',
              '--accent-orange': '#89b4fa',
              '--accent-blue': '#1e66f5',
              '--accent-purple': '#8839ef',
              '--selection-bg': '#ccd0da',
              '--scrollbar-thumb': '#9ca0b0',
              '--nav-bg': 'rgba(239, 241, 245, 0.85)',
              '--card-hover': 'rgba(0, 0, 0, 0.04)',
              '--subtle-bg': 'rgba(0, 0, 0, 0.04)',
              '--border-subtle': 'rgba(0, 0, 0, 0.08)',
              '--border-medium': 'rgba(0, 0, 0, 0.14)',
              '--overlay-light': 'rgba(0, 0, 0, 0.03)',
              '--overlay-medium': 'rgba(0, 0, 0, 0.05)',
              '--shadow-medium': 'rgba(0, 0, 0, 0.12)',
              '--tag-bg': 'rgba(0, 0, 0, 0.06)'
            },
            White: {
              '--bg-color': '#ffffff',
              '--card-bg': '#f4f4f5',
              '--card-bg-elevated': '#ebebed',
              '--text-primary': '#111113',
              '--text-muted': '#3f3f46',
              '--heading-color': '#09090b',
              '--accent-orange': '#c2410c',
              '--accent-blue': '#1d4ed8',
              '--accent-purple': '#6d28d9',
              '--selection-bg': '#e4e4e7',
              '--scrollbar-thumb': '#71717a',
              '--nav-bg': 'rgba(255, 255, 255, 0.88)',
              '--card-hover': 'rgba(0, 0, 0, 0.045)',
              '--subtle-bg': 'rgba(0, 0, 0, 0.04)',
              '--border-subtle': 'rgba(0, 0, 0, 0.09)',
              '--border-medium': 'rgba(0, 0, 0, 0.16)',
              '--overlay-light': 'rgba(0, 0, 0, 0.03)',
              '--overlay-medium': 'rgba(0, 0, 0, 0.06)',
              '--shadow-medium': 'rgba(0, 0, 0, 0.1)',
              '--tag-bg': 'rgba(0, 0, 0, 0.06)'
            },
            'Tokyo Night': {
              '--bg-color': '#1a1b26',
              '--card-bg': '#24283b',
              '--card-bg-elevated': '#1f2335',
              '--text-primary': '#c0caf5',
              '--text-muted': '#565f89',
              '--accent-orange': '#7aa2f7',
              '--accent-blue': '#7dcfff',
              '--accent-purple': '#bb9af7',
              '--selection-bg': '#2c3459',
              '--scrollbar-thumb': '#565f89',
              '--nav-bg': 'rgba(26, 27, 38, 0.82)',
              '--card-hover': 'rgba(192, 202, 245, 0.06)'
            }
          };
          var saved = localStorage.getItem('theme-prefs');
          if (!saved) return;
          var prefs = JSON.parse(saved);
          var root = document.documentElement;
          var palette = prefs && prefs.theme ? palettes[prefs.theme] : null;
          if (palette) {
            for (var key in palette) root.style.setProperty(key, palette[key]);
            root.classList.toggle('Latte', prefs.theme === 'Latte' || prefs.theme === 'White');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', palette['--bg-color']);
          }
          if (prefs && prefs.accent) root.style.setProperty('--accent-orange', prefs.accent);
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      (function () {
        if (!document.documentElement.classList.contains('js')) return;
        var nodes = document.querySelectorAll('.reveal');
        if (!nodes.length) return;
        if (!('IntersectionObserver' in window)) {
          nodes.forEach(function (node) {
            node.classList.add('is-visible');
          });
          return;
        }
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return;
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            });
          },
          { threshold: 0.12, rootMargin: '0px 0px 8% 0px' }
        );
        nodes.forEach(function (node) {
          var rect = node.getBoundingClientRect();
          var onScreen = rect.top < window.innerHeight * 0.92 && rect.bottom > 0;
          if (onScreen) node.classList.add('is-visible', 'is-immediate');
          else observer.observe(node);
        });
      })();
    </script>
  </body>
</html>
